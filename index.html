<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Birthday Book – Locked 🔒</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Pacifico&display=swap"
rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
:root {
  --bg-blur: #3B342A;
  --cream: #E8E1C9;
  --brown: #3B342A;
  --gold: #FFD580;
  --warm-text: #5A3E2B;
  --accent: #C97B3C;
  --soft-pink: #F5C4C4;
  --btn-bg: #F5E6C8;
  --btn-hover: #FFD580;
  --btn-shadow: rgba(90, 62, 43, 0.25);
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url('Book_bg.jpg') center/cover no-repeat;
  filter: blur(8px) brightness(0.55);
  z-index: 0;
}

/* ---------- Floating atmosphere ---------- */
#atmosphere {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}
#atmosphere span {
  position: absolute;
  bottom: -10%;
  font-size: 20px;
  opacity: 0.5;
  animation-name: floatUp;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}
@keyframes floatUp {
  0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.55; }
  90%  { opacity: 0.35; }
  100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}

#pin-overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  gap: 40px;
  transition: opacity 0.6s ease;
}
#pin-overlay.fade-out { opacity: 0; }

.pin-card-container {
  display: flex;
  justify-content: center;
  gap: 50px;
  align-items: center;
  background: var(--cream);
  border-radius: 28px;
  padding: 36px 40px 32px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 0 3px var(--gold);
  animation: glowPulse 3.5s ease-in-out infinite;
}
@keyframes glowPulse {
  0%, 100% { box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 0 3px var(--gold), 0 0 18px rgba(255,213,128,0.25); }
  50% { box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 0 3px var(--gold), 0 0 38px rgba(255,213,128,0.55); }
}

/* shimmer sweep */
.pin-card-container::after {
  content: "";
  position: absolute;
  top: 0;
  left: -150%;
  width: 60%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
  animation: shimmerSweep 6s ease-in-out infinite;
  pointer-events: none;
}
@keyframes shimmerSweep {
  0% { left: -150%; }
  40% { left: 150%; }
  100% { left: 150%; }
}

.pin-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  position: relative;
  z-index: 2;
  animation: floatIn 0.5s cubic-bezier(.22, 1, .36, 1) both;
}
@keyframes floatIn {
  from { opacity: 0; transform: scale(0.85) translateY(30px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.bow {
  font-size: 38px;
  line-height: 1;
  margin-bottom: -6px;
  animation: wiggle 3s ease-in-out infinite;
}
@keyframes wiggle {
  0%, 100% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg); }
}
.lock-icon {
  width: 64px;
  height: 64px;
  background: var(--brown);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  box-shadow: 0 4px 12px var(--btn-shadow);
  border: 3px solid var(--gold);
  transition: transform 0.4s ease;
}
.lock-icon.unlocked {
  transform: scale(1.15) rotate(-8deg);
  background: var(--accent);
}
.pin-title {
  font-family: 'Pacifico', cursive;
  font-size: 18px;
  color: var(--warm-text);
  text-align: center;
  line-height: 1.3;
}
.pin-title span {
  display: block;
  font-family: 'Poppins', sans-serif;
  font-size: 11px;
  font-weight: 400;
  color: var(--accent);
  letter-spacing: 0.5px;
  margin-top: 2px;
}
.pin-display {
  display: flex;
  gap: 10px;
}
.pin-dot {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: #fff;
  border: 2px solid rgba(90, 62, 43, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: var(--warm-text);
  font-weight: 700;
  transition: all 0.15s;
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.08);
}
.pin-dot.filled {
  background: var(--brown);
  border-color: var(--gold);
  color: var(--gold);
  box-shadow: 0 3px 10px rgba(59, 52, 42, 0.35);
}
.pin-dot.error {
  background: #e74c3c;
  border-color: #c0392b;
  color: #fff;
  animation: shake 0.4s ease;
}
.pin-dot.success {
  background: var(--gold);
  border-color: var(--accent);
  color: var(--brown);
  animation: pop 0.4s ease;
}
@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.25); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  width: 100%;
}
.key {
  height: 52px;
  border: none;
  outline: none;
  border-radius: 50px;
  background: var(--btn-bg);
  color: var(--warm-text);
  font-family: 'Poppins', sans-serif;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 0 var(--btn-shadow), 0 2px 8px rgba(0, 0, 0, 0.1);
  transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
  user-select: none;
}
.key:active, .key.pressed {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--btn-shadow);
  background: var(--btn-hover);
}
.key.zero { grid-column: 2; }
.key.del {
  font-size: 14px;
  background: rgba(90, 62, 43, 0.1);
  grid-column: 3;
}
.key.del:active { background: rgba(90, 62, 43, 0.2); }
.pin-hint {
  font-size: 11px;
  color: var(--accent);
  text-align: center;
  height: 14px;
  transition: color 0.3s;
}
.pin-hint.error-msg {
  color: #e74c3c;
  font-weight: 600;
}
.pin-hint.success-msg {
  color: var(--accent);
  font-weight: 700;
}
.left-image {
  display: flex;
  justify-content: center;
}
.left-image img {
  width: 100%;
  max-width: 320px;
  border-radius: 20px;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
  border: 3px solid var(--gold);
}
@media (max-width: 768px) {
  .pin-card-container {
    flex-direction: column;
    gap: 20px;
    padding: 28px 24px;
  }
  .left-image img {
    max-width: 220px;
  }
}
</style>
</head>
<body>

<!-- Floating atmosphere (hearts/sparkles over the blurred background) -->
<div id="atmosphere"></div>

<div id="pin-overlay">
<div class="pin-card-container">

<!-- LEFT SIDE IMAGE -->
<div class="left-image">
<img src="images/BC.png" alt="Birthday Image">
</div>

<!-- RIGHT SIDE PIN CARD -->
<div class="pin-card">
<div class="bow">🎀</div>
<div class="lock-icon" id="lockIcon">🔒</div>
<div class="pin-title">
Enter a passcode
<span>This book is locked with love 💛</span>
</div>

<div class="pin-display" id="pinDisplay">
<div class="pin-dot" id="dot0">✦</div>
<div class="pin-dot" id="dot1">✦</div>
<div class="pin-dot" id="dot2">✦</div>
<div class="pin-dot" id="dot3">✦</div>
</div>

<div class="numpad">
<button class="key" data-val="1">1</button>
<button class="key" data-val="2">2</button>
<button class="key" data-val="3">3</button>
<button class="key" data-val="4">4</button>
<button class="key" data-val="5">5</button>
<button class="key" data-val="6">6</button>
<button class="key" data-val="7">7</button>
<button class="key" data-val="8">8</button>
<button class="key" data-val="9">9</button>
<button class="key zero" data-val="0">0</button>
<button class="key del" id="delBtn">⌫</button>
</div>

<div class="pin-hint" id="pinHint">✨ Enter your 4-digit code</div>
</div>
</div>
</div>

<!--
  Optional sounds — drop short files at these paths and they'll be used.
  If they're missing, everything still works silently, no errors.
-->
<audio id="keyClickSound" src="audio/key-click.mp3"></audio>
<audio id="unlockChime" src="audio/unlock-chime.mp3"></audio>

<script>
  const CORRECT_PIN = "1710";
  let current = "";
  const dots = [0, 1, 2, 3].map(i => document.getElementById("dot" + i));
  const hint = document.getElementById("pinHint");
  const lockIcon = document.getElementById("lockIcon");
  const overlay = document.getElementById("pin-overlay");
  const keyClick = document.getElementById("keyClickSound");
  const unlockChime = document.getElementById("unlockChime");

  // ---- Floating atmosphere ----
  const atmosphere = document.getElementById("atmosphere");
  const symbols = ["💛", "✨", "🎀", "💫"];
  for (let i = 0; i < 14; i++) {
    const el = document.createElement("span");
    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.left = Math.random() * 100 + "%";
    el.style.fontSize = (14 + Math.random() * 14) + "px";
    el.style.animationDuration = (12 + Math.random() * 14) + "s";
    el.style.animationDelay = (Math.random() * 14) + "s";
    atmosphere.appendChild(el);
  }

  function playSound(el) {
    try {
      el.currentTime = 0;
      el.play().catch(() => {});
    } catch (e) {}
  }

  function updateDisplay() {
    dots.forEach((d, i) => {
      d.classList.remove("filled", "error", "success");
      if (i < current.length) {
        d.classList.add("filled");
        d.textContent = "●";
      } else {
        d.textContent = "✦";
      }
    });
  }

  function triggerError() {
    dots.forEach(d => {
      d.classList.remove("filled");
      d.classList.add("error");
      d.textContent = "✕";
    });
    hint.textContent = "Wrong passcode — try again 💔";
    hint.classList.add("error-msg");
    setTimeout(() => {
      current = "";
      updateDisplay();
      hint.textContent = "✨ Enter your 4-digit code";
      hint.classList.remove("error-msg");
    }, 1200);
  }

  function triggerSuccess() {
    playSound(unlockChime);
    dots.forEach(d => {
      d.classList.remove("filled", "error");
      d.classList.add("success");
      d.textContent = "★";
    });
    lockIcon.textContent = "🔓";
    lockIcon.classList.add("unlocked");
    hint.textContent = "Unlocked! 💛 Opening your gift...";
    hint.classList.add("success-msg");

    setTimeout(() => {
      overlay.classList.add("fade-out");
    }, 650);

    setTimeout(() => {
      window.location.href = "HBD.html";
    }, 1250);
  }

  function handleInput(val) {
    if (current.length >= 4) return;
    playSound(keyClick);
    current += val;
    updateDisplay();
    if (current.length === 4) {
      setTimeout(() => {
        if (current === CORRECT_PIN) triggerSuccess();
        else triggerError();
      }, 180);
    }
  }

  function handleDelete() {
    if (current.length === 0) return;
    current = current.slice(0, -1);
    updateDisplay();
    hint.textContent = "✨ Enter your 4-digit code";
    hint.classList.remove("error-msg");
  }

  document.querySelectorAll(".key[data-val]").forEach(btn => {
    btn.addEventListener("click", () => handleInput(btn.dataset.val));
  });
  document.getElementById("delBtn").addEventListener("click", handleDelete);
  document.addEventListener("keydown", e => {
    if (e.key >= "0" && e.key <= "9") handleInput(e.key);
    if (e.key === "Backspace") handleDelete();
  });
</script>
</body>
</html>
