<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Book – Locked 🔒</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Pacifico&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-blur: #3B342A;
      --cream: #E8E1C9;
      --brown: #3B342A;
      --gold: #FFD580;
      --warm-text: #5A3E2B;
      --accent: #C97B3C;
      --soft-pink: #F5C4C4;
      --btn-bg: #F5E6C8;
      --btn-hover: #FFD580;
      --btn-shadow: rgba(90, 62, 43, 0.25);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url('Book_bg.jpg') center/cover no-repeat;
      filter: blur(8px) brightness(0.55);
      z-index: 0;
    }

    #pin-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 40px;
    }

    .pin-card-container {
      display: flex;
      justify-content: center;
      gap: 50px;
      align-items: center;
      background: var(--cream);
      border-radius: 28px;
      padding: 36px 40px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 0 3px var(--gold);
    }

    .pin-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      position: relative;
      animation: floatIn 0.5s cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: scale(0.85) translateY(30px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .bow {
      font-size: 38px;
      line-height: 1;
      margin-bottom: -6px;
      animation: wiggle 3s ease-in-out infinite;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(-5deg); }
      50%       { transform: rotate(5deg); }
    }

    .lock-icon {
      width: 64px;
      height: 64px;
      background: var(--brown);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 12px var(--btn-shadow);
      border: 3px solid var(--gold);
    }

    .pin-title {
      font-family: 'Pacifico', cursive;
      font-size: 18px;
      color: var(--warm-text);
      text-align: center;
      line-height: 1.3;
    }

    .pin-title span {
      display: block;
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: var(--accent);
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .pin-display {
      display: flex;
      gap: 10px;
    }

    .pin-dot {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #fff;
      border: 2px solid rgba(90, 62, 43, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: var(--warm-text);
      font-weight: 700;
      transition: all 0.15s;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .pin-dot.filled {
      background: var(--brown);
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 3px 10px rgba(59, 52, 42, 0.35);
    }

    .pin-dot.error {
      background: #e74c3c;
      border-color: #c0392b;
      color: #fff;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-6px); }
      40%       { transform: translateX(6px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .key {
      height: 52px;
      border: none;
      outline: none;
      border-radius: 50px;
      background: var(--btn-bg);
      color: var(--warm-text);
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--btn-shadow), 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
      user-select: none;
    }

    .key:active, .key.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--btn-shadow);
      background: var(--btn-hover);
    }

    .key.zero { grid-column: 2; }

    .key.del {
      font-size: 14px;
      background: rgba(90, 62, 43, 0.1);
      grid-column: 3;
    }

    .key.del:active { background: rgba(90, 62, 43, 0.2); }

    .pin-hint {
      font-size: 11px;
      color: var(--accent);
      text-align: center;
      height: 14px;
      transition: color 0.3s;
    }

    .pin-hint.error-msg {
      color: #e74c3c;
      font-weight: 600;
    }

    .left-image {
      display: flex;
      justify-content: center;
    }

    .left-image img {
      width: 100%;
      max-width: 320px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
      border: 3px solid var(--gold);
    }

    @media (max-width: 768px) {
      .pin-card-container {
        flex-direction: column;
        gap: 20px;
        padding: 28px 24px;
      }

      .left-image img {
        max-width: 220px;
      }
    }
  </style>
</head>

<body>

  <div id="pin-overlay">
    <div class="pin-card-container">

      <!-- LEFT SIDE IMAGE -->
      <div class="left-image">
        <img src="images/BC.png" alt="Birthday Image">
      </div>

      <!-- RIGHT SIDE PIN CARD -->
      <div class="pin-card">
        <div class="bow">🎀</div>

        <div class="lock-icon">🔒</div>

        <div class="pin-title">
          Enter a passcode
          <span>This book is locked with love 💛</span>
        </div>

        <div class="pin-display" id="pinDisplay">
          <div class="pin-dot" id="dot0">✦</div>
          <div class="pin-dot" id="dot1">✦</div>
          <div class="pin-dot" id="dot2">✦</div>
          <div class="pin-dot" id="dot3">✦</div>
        </div>

        <div class="numpad">
          <button class="key" data-val="1">1</button>
          <button class="key" data-val="2">2</button>
          <button class="key" data-val="3">3</button>
          <button class="key" data-val="4">4</button>
          <button class="key" data-val="5">5</button>
          <button class="key" data-val="6">6</button>
          <button class="key" data-val="7">7</button>
          <button class="key" data-val="8">8</button>
          <button class="key" data-val="9">9</button>
          <button class="key zero" data-val="0">0</button>
          <button class="key del" id="delBtn">⌫</button>
        </div>

        <div class="pin-hint" id="pinHint">✨ Enter your 4-digit code</div>
      </div>

    </div>
  </div>

  <script>
    const CORRECT_PIN = "1710";

    let current = "";
    const dots = [0, 1, 2, 3].map(i => document.getElementById("dot" + i));
    const hint = document.getElementById("pinHint");

    function updateDisplay() {
      dots.forEach((d, i) => {
        d.classList.remove("filled", "error");
        if (i < current.length) {
          d.classList.add("filled");
          d.textContent = "●";
        } else {
          d.textContent = "✦";
        }
      });
    }

    function triggerError() {
      dots.forEach(d => {
        d.classList.remove("filled");
        d.classList.add("error");
        d.textContent = "✕";
      });
      hint.textContent = "Wrong passcode — try again 💔";
      hint.classList.add("error-msg");
      setTimeout(() => {
        current = "";
        updateDisplay();
        hint.textContent = "✨ Enter your 4-digit code";
        hint.classList.remove("error-msg");
      }, 1200);
    }

    function triggerSuccess() {
      window.location.href = "HBD.html";
    }

    function handleInput(val) {
      if (current.length >= 4) return;
      current += val;
      updateDisplay();
      if (current.length === 4) {
        setTimeout(() => {
          if (current === CORRECT_PIN) triggerSuccess();
          else triggerError();
        }, 180);
      }
    }

    function handleDelete() {
      if (current.length === 0) return;
      current = current.slice(0, -1);
      updateDisplay();
      hint.textContent = "✨ Enter your 4-digit code";
      hint.classList.remove("error-msg");
    }

    document.querySelectorAll(".key[data-val]").forEach(btn => {
      btn.addEventListener("click", () => handleInput(btn.dataset.val));
    });
    document.getElementById("delBtn").addEventListener("click", handleDelete);

    document.addEventListener("keydown", e => {
      if (e.key >= "0" && e.key <= "9") handleInput(e.key);
      if (e.key === "Backspace") handleDelete();
    });
  </script>

</body>
</html>
